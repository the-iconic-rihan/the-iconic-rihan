<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Rihan Bagwan, Data Engineer, DevOps and Linux, Python">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf9f6"/><stop offset="1" stop-color="#e3f2ef"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#e4e1da"/></pattern>
<style>
.serif{font-family:Georgia,'Times New Roman',serif;font-weight:700}
.sans{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px;fill:#0f766e}
.lbl{font-size:14px;fill:#5d6270}
@keyframes t0{0%,30.33%{opacity:1}33.33%,100%{opacity:0}}.t0{opacity:1;animation:t0 10.5s infinite}@keyframes t1{0%,33.32%{opacity:0}35.33%,63.67%{opacity:1}66.67%,100%{opacity:0}}.t1{opacity:0;animation:t1 10.5s infinite}@keyframes t2{0%,66.66%{opacity:0}68.67%,97.00%{opacity:1}100.00%,100%{opacity:0}}.t2{opacity:0;animation:t2 10.5s infinite}
@media (prefers-reduced-motion:reduce){.t0{opacity:1;animation:none}.t1,.t2{display:none}}
</style>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#dots)" opacity="0.7"/>
<text class="mono" x="72" y="78" style="font-size:15px;fill:#5d6270">~/the-iconic-rihan · Mumbai, India</text>
<text class="serif" x="70" y="146" font-size="64" fill="#15171c">Rihan Bagwan</text>
<text class="sans" x="72" y="188" font-size="23" fill="#5d6270">Data Engineer  ·  DevOps &amp; Linux  ·  Python</text>
<text class="mono t0" x="72" y="236">&gt; building ETL/ELT pipelines into ClickHouse</text><text class="mono t1" x="72" y="236">&gt; 15–20 GB a day · 12+ pipelines · 8 Airflow DAGs</text><text class="mono t2" x="72" y="236">&gt; running Docker on Linux · shipping with CI/CD</text>
<line x1="760" y1="160" x2="1120" y2="160" stroke="#d5d9d6" stroke-width="2" stroke-dasharray="6 6"/>
<circle r="4" cx="760" cy="160" opacity="0" fill="#0f766e"><animate attributeName="cx" from="760" to="1120" dur="3.6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="0s" repeatCount="indefinite"/></circle><circle r="4" cx="760" cy="160" opacity="0" fill="#0f766e"><animate attributeName="cx" from="760" to="1120" dur="3.6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="1.2s" repeatCount="indefinite"/></circle><circle r="4" cx="760" cy="160" opacity="0" fill="#0f766e"><animate attributeName="cx" from="760" to="1120" dur="3.6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="3.6s" begin="2.4s" repeatCount="indefinite"/></circle>
<circle cx="760" cy="160" r="26" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><circle cx="760" cy="160" r="6" fill="#0f766e"/><text class="mono lbl" x="760" y="212" text-anchor="middle">Ingest</text><circle cx="880" cy="160" r="26" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><circle cx="880" cy="160" r="6" fill="#0f766e"/><text class="mono lbl" x="880" y="212" text-anchor="middle">Airflow</text><circle cx="1000" cy="160" r="26" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><circle cx="1000" cy="160" r="6" fill="#0f766e"/><text class="mono lbl" x="1000" y="212" text-anchor="middle">PySpark</text><circle cx="1120" cy="160" r="26" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><circle cx="1120" cy="160" r="6" fill="#0f766e"/><text class="mono lbl" x="1120" y="212" text-anchor="middle">ClickHouse</text>
</svg>
